# Managed by web-cli/deploy/install-server-hub.sh
# The existing default site remains available for other tunnel hostnames.
map $http_upgrade $server_hub_connection {
    default upgrade;
    '' close;
}
map $http_x_forwarded_proto $server_hub_https {
    default 0;
    https 1;
}
map $http_cf_connecting_ip $server_hub_client_ip {
    default $http_cf_connecting_ip;
    '' $remote_addr;
}

server {
    listen 80;
    listen [::]:80;
    server_name tmp-web.hoanit.io.vn;
    server_tokens off;
    client_max_body_size 16k;
    # TLS terminates at Cloudflare. Plain HTTP clients go to the canonical URL.
    if ($server_hub_https = 0) { return 308 https://tmp-web.hoanit.io.vn$request_uri; }
    access_log off;
    error_log /var/log/nginx/server-hub-error.log warn;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Never expose the old document root or health probe through this hostname.
    location = /api/health { return 404; }
    location = /api/web-cli/api/health { return 404; }
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host tmp-web.hoanit.io.vn;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $server_hub_client_ip;
        proxy_set_header X-Forwarded-Host tmp-web.hoanit.io.vn;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $server_hub_connection;
        proxy_connect_timeout 3s;
        proxy_send_timeout 60s;
        proxy_read_timeout 75s;
        proxy_buffering off;
        proxy_cache off;
    }
}
